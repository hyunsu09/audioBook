<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html{color-scheme:light}
  body{margin:0; font:14px system-ui, sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>문장 반복 낭독기</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  /* Layout: 본문(문장 목록) 한 단 + 설정 사이드바, 하단 고정 재생바 */
  :root{
    --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#F5F8FA; --line:#D2DCE1;
    --fg:#16242C; --muted:#5B7180; --accent:#0B6E75; --accent-soft:#D9EEF0;
    --hl:#B07407; --hl-soft:#FAEFD8; --danger:#9B3A2E;
    --font-ui:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;
    --font-read:'Source Serif 4', Georgia, 'Times New Roman', serif;
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F171C; --surface:#18232A; --surface-2:#1E2A32; --line:#2C3B45;
      --fg:#E5EDF1; --muted:#94A8B4; --accent:#4FC3C9; --accent-soft:#11333A;
      --hl:#EFC35A; --hl-soft:#382D13; --danger:#E08272;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F171C; --surface:#18232A; --surface-2:#1E2A32; --line:#2C3B45;
    --fg:#E5EDF1; --muted:#94A8B4; --accent:#4FC3C9; --accent-soft:#11333A;
    --hl:#EFC35A; --hl-soft:#382D13; --danger:#E08272;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--fg);
    font-family:var(--font-ui); font-size:15px; line-height:1.6;
    padding-inline:16px; padding-block:24px 128px;
  }
  .wrap{max-width:1060px; margin:0 auto; display:flex; flex-direction:column; gap:20px}

  header h1{
    font-size:26px; font-weight:600; margin:0; letter-spacing:-.01em; text-wrap:balance;
  }
  header p{margin:6px 0 0; color:var(--muted); font-size:13.5px; max-width:62ch}

  .cols{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; align-items:start}
  @media (max-width:880px){ .cols{grid-template-columns:minmax(0,1fr)} }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0;
  }
  .card > h2{
    margin:0; font-size:11.5px; font-weight:600; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted);
  }

  textarea{
    width:100%; min-height:110px; resize:vertical;
    font-family:var(--font-read); font-size:16px; line-height:1.55;
    color:var(--fg); background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; padding:12px;
  }
  textarea:focus-visible, select:focus-visible, input:focus-visible, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .spacer{flex:1 1 auto}

  button{
    font-family:inherit; font-size:13.5px; color:var(--fg);
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:7px 12px; cursor:pointer;
  }
  button:hover{border-color:var(--accent); color:var(--accent)}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500}
  button.primary:hover{color:#fff; filter:brightness(1.08)}
  button.ghost{background:transparent}
  button:disabled{opacity:.45; cursor:not-allowed}
  button:disabled:hover{border-color:var(--line); color:var(--fg)}

  /* 문장 목록 */
  .sents{display:flex; flex-direction:column; gap:4px; min-width:0}
  .sent{
    text-align:left; width:100%; background:transparent; border:1px solid transparent;
    border-left:3px solid transparent; border-radius:6px; padding:9px 10px;
    font-family:var(--font-read); font-size:17px; line-height:1.55; color:var(--fg);
    display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; align-items:start;
  }
  .sent:hover{background:var(--surface-2); border-color:var(--line); border-left-color:var(--line); color:var(--fg)}
  .sent .n{
    font-family:var(--font-ui); font-size:11px; color:var(--muted);
    font-variant-numeric:tabular-nums; padding-top:5px;
  }
  .sent.is-current{
    background:var(--hl-soft); border-color:transparent; border-left-color:var(--hl);
  }
  .sent.is-current .n{color:var(--hl); font-weight:600}
  .empty{color:var(--muted); font-size:13.5px; padding:6px 2px}

  /* 설정 */
  .field{display:flex; flex-direction:column; gap:5px}
  .field label{font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:8px}
  .field label b{color:var(--fg); font-weight:500; font-variant-numeric:tabular-nums}
  select, input[type=number]{
    width:100%; font-family:inherit; font-size:13.5px; color:var(--fg);
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:7px 9px;
  }
  input[type=range]{width:100%; accent-color:var(--accent)}
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{border:0; border-radius:0; flex:1; background:var(--surface-2); padding:8px 6px}
  .seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:500}
  .hint{font-size:12px; color:var(--muted); margin:0}
  .warn{
    font-size:12.5px; color:var(--danger); background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin:0;
  }

  /* 재생바 */
  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:var(--surface); border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .bar-in{
    max-width:1060px; margin:0 auto;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .bar button{padding:9px 13px}
  .bigplay{min-width:104px; font-size:14px}
  .meter{
    font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;
    display:flex; gap:10px; align-items:baseline;
  }
  .meter b{color:var(--fg); font-weight:500}
  .track{
    flex:1 1 140px; height:4px; min-width:90px;
    background:var(--surface-2); border-radius:99px; overflow:hidden;
  }
  .track i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px}
  @media (prefers-reduced-motion:no-preference){ .track i{transition:width .25s ease} }

  kbd{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:1px 5px;
  }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>문장 반복 낭독기</h1>
    <p>읽고 싶은 영어 문장을 붙여넣으면 문장 단위로 잘라서 읽어 줍니다. 목소리와 속도를 바꾸고, 문장마다 몇 번씩 반복할지 정해 두면 따라 읽기 연습에 쓸 수 있습니다.</p>
  </header>

  <div class="cols">
    <div style="display:flex; flex-direction:column; gap:20px; min-width:0">
      <section class="card">
        <h2>읽을 텍스트</h2>
        <textarea id="text" spellcheck="false" placeholder="여기에 붙여넣으세요 (Ctrl+V)"></textarea>
        <div class="row">
          <p class="hint" id="count">0문장</p>
          <span class="spacer"></span>
          <button type="button" id="clear" class="ghost">비우기</button>
          <button type="button" id="sample" class="ghost">예시 문장</button>
        </div>
      </section>

      <section class="card">
        <h2>문장</h2>
        <div class="sents" id="sents"></div>
        <p class="hint">문장을 누르면 그 문장부터 읽습니다. <kbd>Space</kbd> 재생·일시정지, <kbd>←</kbd> <kbd>→</kbd> 이전·다음 문장.</p>
      </section>
    </div>

    <aside class="card" style="position:sticky; top:16px">
      <h2>설정</h2>

      <div class="field">
        <label for="voice">목소리</label>
        <select id="voice"></select>
        <p class="hint" id="voiceHint">목소리 목록을 불러오는 중입니다.</p>
      </div>

      <div class="field">
        <label for="rate">속도 <b id="rateVal">1.00×</b></label>
        <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="1">
      </div>

      <div class="field">
        <label for="pitch">높낮이 <b id="pitchVal">1.0</b></label>
        <input type="range" id="pitch" min="0.6" max="1.4" step="0.1" value="1">
      </div>

      <div class="field">
        <label for="reps">문장마다 반복 <b id="repsVal">1회</b></label>
        <input type="range" id="reps" min="1" max="5" step="1" value="1">
      </div>

      <div class="field">
        <label for="gap">문장 사이 쉬는 시간 <b id="gapVal">0.6초</b></label>
        <input type="range" id="gap" min="0" max="3" step="0.1" value="0.6">
      </div>

      <div class="field">
        <label>끝까지 읽은 뒤</label>
        <div class="seg" role="group" aria-label="반복 방식">
          <button type="button" id="loopOff" aria-pressed="true">멈추기</button>
          <button type="button" id="loopOn" aria-pressed="false">처음부터 다시</button>
        </div>
      </div>

      <p class="warn" id="warn" hidden></p>
    </aside>
  </div>
</div>

<div class="bar">
  <div class="bar-in">
    <button type="button" id="prev" title="이전 문장">◀◀</button>
    <button type="button" id="play" class="primary bigplay">▶ 재생</button>
    <button type="button" id="next" title="다음 문장">▶▶</button>
    <button type="button" id="stop">■ 정지</button>
    <div class="track" aria-hidden="true"><i id="fill"></i></div>
    <div class="meter"><span id="pos"><b>0</b> / 0</span><span id="rep"></span></div>
  </div>
</div>

<script>
(function () {
  var SAMPLE = '"Listen to what Jerome tells you," said Kaira’s mother. She gave her husband a kiss on his puffy cheek. "He’s made you what you are."';
  var synth = window.speechSynthesis;

  var el = {
    text: document.getElementById('text'),
    sents: document.getElementById('sents'),
    count: document.getElementById('count'),
    voice: document.getElementById('voice'),
    voiceHint: document.getElementById('voiceHint'),
    rate: document.getElementById('rate'), rateVal: document.getElementById('rateVal'),
    pitch: document.getElementById('pitch'), pitchVal: document.getElementById('pitchVal'),
    reps: document.getElementById('reps'), repsVal: document.getElementById('repsVal'),
    gap: document.getElementById('gap'), gapVal: document.getElementById('gapVal'),
    loopOff: document.getElementById('loopOff'), loopOn: document.getElementById('loopOn'),
    play: document.getElementById('play'), stop: document.getElementById('stop'),
    prev: document.getElementById('prev'), next: document.getElementById('next'),
    pos: document.getElementById('pos'), rep: document.getElementById('rep'),
    fill: document.getElementById('fill'), warn: document.getElementById('warn'),
    clear: document.getElementById('clear'), sample: document.getElementById('sample')
  };

  var S = { sentences: [], idx: 0, rep: 1, playing: false, paused: false, loop: false, timer: null, u: null };

  /* ---------- 저장 ---------- */
  var KEY = 'repeat-reader-v1';
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        text: el.text.value, rate: el.rate.value, pitch: el.pitch.value,
        reps: el.reps.value, gap: el.gap.value, loop: S.loop, voice: el.voice.value
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!d) return null;
      return d;
    } catch (e) { return null; }
  }

  /* ---------- 문장 나누기 ---------- */
  function split(raw) {
    var out = [];
    String(raw || '').split(/\n+/).forEach(function (line) {
      var m = line.match(/[^.!?…]+(?:[.!?…]+["'”’\)]*|$)/g);
      if (!m) return;
      m.forEach(function (s) { s = s.trim(); if (s) out.push(s); });
    });
    return out;
  }

  function renderSentences() {
    S.sentences = split(el.text.value);
    el.sents.textContent = '';
    if (!S.sentences.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '위 칸에 텍스트를 넣으면 문장이 여기에 나옵니다.';
      el.sents.appendChild(p);
    } else {
      S.sentences.forEach(function (s, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'sent';
        var n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
        var t = document.createElement('span'); t.textContent = s;
        b.appendChild(n); b.appendChild(t);
        b.addEventListener('click', function () { jumpTo(i); });
        el.sents.appendChild(b);
      });
    }
    el.count.textContent = S.sentences.length + '문장';
    if (S.idx >= S.sentences.length) S.idx = 0;
    paint();
  }

  function paint() {
    var kids = el.sents.querySelectorAll('.sent');
    for (var i = 0; i < kids.length; i++) {
      kids[i].classList.toggle('is-current', S.playing && i === S.idx);
    }
    var total = S.sentences.length;
    el.pos.innerHTML = '<b>' + (total ? S.idx + 1 : 0) + '</b> / ' + total;
    var reps = +el.reps.value;
    el.rep.textContent = (S.playing && reps > 1) ? (S.rep + '회째 / ' + reps + '회') : '';
    el.fill.style.width = total ? (((S.idx + (S.playing ? 1 : 0)) / total) * 100) + '%' : '0%';
    el.play.textContent = (S.playing && !S.paused) ? '❚❚ 일시정지' : '▶ 재생';
    var none = !total;
    el.play.disabled = none; el.prev.disabled = none; el.next.disabled = none;
    el.stop.disabled = !S.playing;
  }

  /* ---------- 목소리 ---------- */
  var voices = [];
  function fillVoices(preferURI) {
    var all = synth ? synth.getVoices() : [];
    if (!all.length) return false;

    var natural = all.filter(function (v) { return /natural/i.test(v.name || ''); });
    var naturalOnly = natural.length > 0;
    voices = naturalOnly ? natural : all;

    el.voiceHint.textContent = naturalOnly
      ? 'Natural(신경망) 음성만 골라 놓았습니다 — ' + natural.length + '개.'
      : '이 브라우저에는 Natural 음성이 없어서 전체 목록을 보여 줍니다. Microsoft Edge에서 열면 Natural 음성을 쓸 수 있습니다.';

    var en = [], rest = [];
    voices.forEach(function (v) { (/^en/i.test(v.lang) ? en : rest).push(v); });
    el.voice.textContent = '';
    function group(label, list) {
      if (!list.length) return;
      var g = document.createElement('optgroup');
      g.label = label;
      list.forEach(function (v) {
        var o = document.createElement('option');
        o.value = v.voiceURI;
        o.textContent = v.name + ' (' + v.lang + ')';
        g.appendChild(o);
      });
      el.voice.appendChild(g);
    }
    group('영어', en);
    group('그 밖의 언어', rest);

    var want = preferURI && voices.some(function (v) { return v.voiceURI === preferURI; }) ? preferURI : null;
    if (!want) {
      var score = function (v) {
        var n = (v.name || '').toLowerCase();
        var s = /^en/i.test(v.lang) ? 10 : 0;
        if (/^en-us/i.test(v.lang)) s += 3;
        if (n.indexOf('natural') >= 0) s += 8;
        if (n.indexOf('online') >= 0) s += 4;
        if (n.indexOf('google') >= 0) s += 3;
        return s;
      };
      var best = voices.slice().sort(function (a, b) { return score(b) - score(a); })[0];
      want = best ? best.voiceURI : '';
    }
    el.voice.value = want;
    return true;
  }
  function currentVoice() {
    for (var i = 0; i < voices.length; i++) if (voices[i].voiceURI === el.voice.value) return voices[i];
    return null;
  }

  /* ---------- 재생 ---------- */
  var keepAlive = null;
  function clearTimer() { if (S.timer) { clearTimeout(S.timer); S.timer = null; } }

  function speak() {
    if (!synth || !S.sentences.length) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(S.sentences[S.idx]);
    var v = currentVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = +el.rate.value;
    u.pitch = +el.pitch.value;
    u.onend = function () { if (S.playing && !S.paused) afterOne(); };
    u.onerror = function () { if (S.playing) afterOne(); };
    S.u = u;
    synth.speak(u);
    paint();
  }

  function afterOne() {
    clearTimer();
    var wait = (+el.gap.value) * 1000;
    S.timer = setTimeout(function () {
      if (!S.playing) return;
      var reps = +el.reps.value;
      if (S.rep < reps) { S.rep++; speak(); return; }
      S.rep = 1;
      if (S.idx + 1 < S.sentences.length) { S.idx++; speak(); return; }
      if (S.loop) { S.idx = 0; speak(); return; }
      stopAll();
    }, wait);
  }

  function start() {
    if (!S.sentences.length) return;
    S.playing = true; S.paused = false;
    if (!keepAlive) keepAlive = setInterval(function () {
      if (S.playing && !S.paused && synth && synth.speaking) { try { synth.resume(); } catch (e) {} }
    }, 8000);
    speak();
  }
  function stopAll() {
    S.playing = false; S.paused = false; S.rep = 1;
    clearTimer();
    if (keepAlive) { clearInterval(keepAlive); keepAlive = null; }
    if (synth) synth.cancel();
    paint();
  }
  function toggle() {
    if (!S.playing) { start(); return; }
    if (S.paused) { S.paused = false; try { synth.resume(); } catch (e) {} paint(); }
    else { S.paused = true; try { synth.pause(); } catch (e) {} clearTimer(); paint(); }
  }
  function jumpTo(i) {
    S.idx = Math.max(0, Math.min(i, S.sentences.length - 1));
    S.rep = 1;
    clearTimer();
    if (S.playing) { S.paused = false; speak(); } else start();
  }
  function step(d) {
    if (!S.sentences.length) return;
    jumpTo(S.idx + d);
  }

  /* ---------- 이벤트 ---------- */
  el.play.addEventListener('click', toggle);
  el.stop.addEventListener('click', stopAll);
  el.prev.addEventListener('click', function () { step(-1); });
  el.next.addEventListener('click', function () { step(1); });

  var t;
  el.text.addEventListener('input', function () {
    clearTimeout(t);
    t = setTimeout(function () { renderSentences(); save(); }, 250);
  });
  el.clear.addEventListener('click', function () {
    stopAll(); el.text.value = ''; S.idx = 0; renderSentences(); save(); el.text.focus();
  });
  el.sample.addEventListener('click', function () {
    stopAll(); el.text.value = SAMPLE; S.idx = 0; renderSentences(); save();
  });

  function bindRange(input, out, fmt) {
    var upd = function () { out.textContent = fmt(input.value); };
    input.addEventListener('input', function () { upd(); paint(); });
    input.addEventListener('change', save);
    upd();
  }
  bindRange(el.rate, el.rateVal, function (v) { return (+v).toFixed(2) + '×'; });
  bindRange(el.pitch, el.pitchVal, function (v) { return (+v).toFixed(1); });
  bindRange(el.reps, el.repsVal, function (v) { return v + '회'; });
  bindRange(el.gap, el.gapVal, function (v) { return (+v).toFixed(1) + '초'; });

  el.voice.addEventListener('change', function () {
    save();
    if (S.playing && !S.paused) speak();
  });

  function setLoop(on) {
    S.loop = on;
    el.loopOn.setAttribute('aria-pressed', on ? 'true' : 'false');
    el.loopOff.setAttribute('aria-pressed', on ? 'false' : 'true');
    save();
  }
  el.loopOn.addEventListener('click', function () { setLoop(true); });
  el.loopOff.addEventListener('click', function () { setLoop(false); });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  });

  window.addEventListener('beforeunload', function () { if (synth) synth.cancel(); });

  /* ---------- 시작 ---------- */
  var saved = load();
  el.text.value = (saved && typeof saved.text === 'string' && saved.text) ? saved.text : SAMPLE;
  if (saved) {
    if (saved.rate) el.rate.value = saved.rate;
    if (saved.pitch) el.pitch.value = saved.pitch;
    if (saved.reps) el.reps.value = saved.reps;
    if (saved.gap !== undefined) el.gap.value = saved.gap;
  }
  el.rate.dispatchEvent(new Event('input'));
  el.pitch.dispatchEvent(new Event('input'));
  el.reps.dispatchEvent(new Event('input'));
  el.gap.dispatchEvent(new Event('input'));
  setLoop(!!(saved && saved.loop));
  renderSentences();

  if (!synth) {
    el.warn.hidden = false;
    el.warn.textContent = '이 브라우저는 음성 읽기를 지원하지 않습니다. Edge나 Chrome에서 열어 주세요.';
    el.play.disabled = true;
  } else {
    var prefer = saved && saved.voice;
    if (!fillVoices(prefer)) {
      synth.addEventListener('voiceschanged', function once() {
        synth.removeEventListener('voiceschanged', once);
        if (!fillVoices(prefer)) {
          el.voiceHint.textContent = '목소리 목록을 불러오지 못했습니다. 새로고침해 보세요.';
        }
      });
    }
  }
})();
</script>

</body>
</html>
